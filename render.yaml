# Render deployment blueprint for Fluxo
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fluxo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker so the in-process quote cache and snapshot day-claim are
    # shared by every request (web + iOS API); threads keep it concurrent.
    startCommand: gunicorn -w 1 --threads 8 app:app
    envVars:
      - key: SUPABASE_URL
        sync: false   # set this in the Render dashboard (secret)
      - key: SUPABASE_KEY
        sync: false   # set this in the Render dashboard (secret)
      - key: API_TOKEN
        sync: false   # bearer token for /api/v1 (iOS app); unset = API disabled
